<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">文档风格，让阅读更舒适 · 功能示意</title><desc id="desc">左侧选择自定义文档风格和色板，右侧展示标题、段落与留白。</desc>
<rect width="1000" height="600" rx="16" fill="#151b21"/>
<g font-family="'Segoe UI','Microsoft YaHei',sans-serif"><text x="38" y="46" font-size="21" fill="#e9eef2" >文档风格，让阅读更舒适</text><text x="962" y="45" font-size="14" fill="#89a398" text-anchor="end">功能示意</text>
<path d="M32 68 H968" stroke="#303a43"/><rect x="32" y="92" width="272" height="434" rx="12" fill="#20272e" stroke="#35414c"/><rect x="326" y="92" width="642" height="434" rx="12" fill="#20272e" stroke="#35414c"/><text x="56" y="132" font-size="18" fill="#e9eef2" >文档风格</text><text x="64" y="169" font-size="17" fill="#a5b3bf" >简洁默认</text><text x="64" y="228" font-size="17" fill="#a5b3bf" >手绘卡通</text><rect x="48" y="260" width="240" height="46" rx="8" fill="#233c38" stroke="#3b6755"/><text x="64" y="287" font-size="17" fill="#80c5ad" >我的阅读风格</text><text x="56" y="392" font-size="16" fill="#8d9eac" >字体 / 颜色 / 留白</text><rect x="57" y="423" width="36" height="36" rx="18" fill="#e3e8ed" stroke="#e3e8ed"/><rect x="111" y="423" width="36" height="36" rx="18" fill="#80c5ad" stroke="#80c5ad"/><rect x="165" y="423" width="36" height="36" rx="18" fill="#9fc4e9" stroke="#9fc4e9"/><rect x="219" y="423" width="36" height="36" rx="18" fill="#b6a4d9" stroke="#b6a4d9"/><text x="354" y="132" font-size="15" fill="#80c5ad" >实时预览</text><text x="364" y="205" font-size="30" fill="#e9eef2" >适合自己的阅读节奏</text><text x="364" y="256" font-size="20" fill="#cdd6df" >字体、颜色和留白，构成文章的气质。</text><text x="364" y="296" font-size="20" fill="#cdd6df" >保留清晰层次，让内容自然地被阅读。</text><path d="M364 334 H924" fill="none" stroke="#35414c" stroke-width="2" /><text x="364" y="378" font-size="23" fill="#e9eef2" >小标题，让结构一目了然</text><text x="364" y="423" font-size="18" fill="#a5b3bf" >复制预设后修改，也可以导入与导出风格。</text>
<text x="38" y="574" font-size="13" fill="#7e909e" >JMarkdownEditor</text><text x="962" y="574" font-size="13" fill="#7e909e" text-anchor="end">示意图，非软件截图</text></g></svg>