<g font-family="'Segoe UI','Microsoft YaHei',sans-serif"><text x="38" y="46" font-size="21" fill="#e9eef2" >AI 写作，留在文章现场</text><text x="962" y="45" font-size="14" fill="#89a398" text-anchor="end">功能示意</text>
<path d="M32 68 H968" stroke="#303a43"/><rect x="32" y="92" width="526" height="434" rx="12" fill="#20272e" stroke="#35414c"/><rect x="578" y="92" width="390" height="434" rx="12" fill="#20272e" stroke="#35414c"/><text x="58" y="134" font-size="15" fill="#8d9eac" >写作计划.md</text><text x="58" y="189" font-size="28" fill="#e9eef2" >把想法写成文章</text><text x="58" y="239" font-size="18" fill="#cdd6df" >从观察开始，整理问题与目标。</text><text x="58" y="278" font-size="18" fill="#cdd6df" >再用具体的例子，让表达更清晰。</text><rect x="57" y="310" width="476" height="90" rx="6" fill="#20362f" stroke="#3b6755"/><path d="M57 321 V389" fill="none" stroke="#80c5ad" stroke-width="2" /><text x="77" y="344" font-size="14" fill="#80c5ad" >AI 试改</text><text x="77" y="376" font-size="18" fill="#cdd6df" >先说清楚问题，再给出行动建议。</text><text x="58" y="467" font-size="18" fill="#80c5ad" >原位试读  →  保留 / 还原</text><text x="602" y="130" font-size="15" fill="#8d9eac" >关联当前文档</text><rect x="676" y="164" width="267" height="54" rx="18" fill="#244b70" stroke="#244b70"/><text x="694" y="198" font-size="17" fill="#e6f0fa" >让选中的这一段更简洁</text><text x="602" y="263" font-size="16" fill="#cdd6df" >已生成修改建议，可在正文试读。</text><text x="602" y="305" font-size="14" fill="#8d9eac" >▸ 修改选中文字 · 已完成</text><rect x="598" y="405" width="350" height="95" rx="12" fill="#28323b" stroke="#35414c"/><text x="616" y="436" font-size="16" fill="#a0afbc" >继续描述你的想法…</text><text x="617" y="480" font-size="14" fill="#8d9eac" >+    请求批准</text><text x="917" y="480" font-size="24" fill="#80c5ad" >↑</text>
